name: Deploy to GitHub Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    test-build-deploy:
        runs-on: ubuntu-latest
        # Publishes to the gh-pages branch with the workflow token.
        permissions:
            contents: write
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v7

            # Pinned Bun: a new release must not break the deploy without notice.
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Type check
              run: bun run check

            - name: Run tests
              run: bun test

            # Site base: /<repo> (or empty when the repo is <user>.github.io).
            - name: Build
              run: |
                  REPO="${{ github.event.repository.name }}"
                  if [[ "$REPO" == *.github.io ]]; then export BASE_PATH=""; else export BASE_PATH="/$REPO"; fi
                  bun run build

            # SPA: index.html for the root and 404.html for any deep route.
            - name: SPA entry points
              run: cp build/404.html build/index.html

            - name: Generate .nojekyll
              run: echo "" > build/.nojekyll

            - name: Deploy
              uses: JamesIves/github-pages-deploy-action@v4.9.0
              with:
                  branch: gh-pages
                  folder: build
